name: Embeddings comparison validation

on:
  push:
    branches: [verify/embeddings-comparison-url]

permissions:
  contents: read

jobs:
  regression:
    if: github.repository == 'A-P-S-Bhaidav/model_server'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install openai==3.48.0 numpy==1.26.4 pytest==9.2.0
      - name: Verify the fixed embeddings comparison and record the tested files
        run: |
          git rev-parse HEAD:demos/embeddings/compare_results.py HEAD:demos/embeddings/test_compare_results.py
          python -m pytest -q demos/embeddings/test_compare_results.py
          python -m py_compile demos/embeddings/compare_results.py demos/embeddings/test_compare_results.py
          git diff --check HEAD^ HEAD
      - name: Run repository SDL checks
        run: make sdl-check
